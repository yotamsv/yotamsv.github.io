<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pictures of Home</title>
    <style>
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .gallery img {
            width: 150px; /* Adjust the size as needed */
            height: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.3s ease, z-index 0s;
        }
        .gallery img.enlarged {
            transform: scale(2); /* Scale factor for enlargement */
            z-index: 10; /* Ensure the enlarged image is on top */
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Prevent overflow */
        }
        .overlay img {
            max-width: 80%;
            max-height: 80%;
        }
        .nav-buttons {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
            padding: 0 10px; /* Adjust padding to move arrows closer */
        }
        .nav-buttons button {
            background: rgba(255, 255, 255, 0.5);
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 24px;
            line-height: 0;
            border-radius: 50%;
            transition: background 0.3s;
        }
        .nav-buttons button:hover {
            background: rgba(255, 255, 255, 0.8);
        }
        .prev {
            margin-left: 10px; /* Adjust margin to move the left arrow closer */
        }
        .next {
            margin-right: 10px; /* Adjust margin to move the right arrow closer */
        }
    </style>
</head>
<body>
    <h1>Pictures of Home </h1>
    <div class="gallery" id="photoGallery"></div>
    
    <div class="overlay" id="overlay">
        <img id="overlayImage" src="" alt="Enlarged Picture">
        <div class="nav-buttons">
            <button class="prev" id="prevButton">&larr;</button>
            <button class="next" id="nextButton">&rarr;</button>
        </div>
    </div>

    <script>
        let pictures = [];
        let currentIndex = 0;

        function displayPictures() {
            const gallery = document.getElementById('photoGallery');
            const pictureCount = 279;

            for (let i = 1; i <= pictureCount; i++) {
                const img = document.createElement('img');
                img.src = `picture${i}.jpg`;
                img.alt = `Picture ${i}`;
                img.onclick = () => enlargeImage(i - 1); // Use zero-based index
                gallery.appendChild(img);

                pictures.push(img.src); // Store image src in the array
            }
        }

        function enlargeImage(index) {
            currentIndex = index; // Set the current index
            const overlay = document.getElementById('overlay');
            const overlayImage = document.getElementById('overlayImage');
            overlayImage.src = pictures[currentIndex];
            overlay.style.display = 'flex';
        }

        function showNextImage() {
            currentIndex = (currentIndex + 1) % pictures.length; // Loop back to the first image
            const overlayImage = document.getElementById('overlayImage');
            overlayImage.src = pictures[currentIndex];
        }

        function showPreviousImage() {
            currentIndex = (currentIndex - 1 + pictures.length) % pictures.length; // Loop to the last image
            const overlayImage = document.getElementById('overlayImage');
            overlayImage.src = pictures[currentIndex];
        }

        function handleKeyboardNavigation(event) {
            if (event.key === 'ArrowLeft') {
                showPreviousImage();
            } else if (event.key === 'ArrowRight') {
                showNextImage();
            }
        }

        document.getElementById('prevButton').onclick = (event) => {
            event.stopPropagation(); // Prevent the overlay from closing
            showPreviousImage();
        };
        document.getElementById('nextButton').onclick = (event) => {
            event.stopPropagation(); // Prevent the overlay from closing
            showNextImage();
        };

        document.getElementById('overlay').onclick = () => {
            document.getElementById('overlay').style.display = 'none';
        };

        document.addEventListener('keydown', handleKeyboardNavigation);

        displayPictures();
    </script>
</body>
</html>
